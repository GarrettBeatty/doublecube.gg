name: Deploy to Lightsail

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: garrettbeatty

jobs:
  build-server:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Server image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --push \
            -f Backgammon.Server/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/backgammon-server:$IMAGE_TAG \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/backgammon-server:latest \
            .

  build-webclient:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push WebClient image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --push \
            -f Backgammon.WebClient/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/backgammon-webclient:$IMAGE_TAG \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/backgammon-webclient:latest \
            .

  build-gnubg:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push gnubg-service image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --push \
            -f gnubg-service/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/backgammon-gnubg:$IMAGE_TAG \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/backgammon-gnubg:latest \
            gnubg-service

  deploy:
    needs: [build-server, build-webclient, build-gnubg]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy to Lightsail
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$LIGHTSAIL_HOST" >> ~/.ssh/known_hosts

          scp -i ~/.ssh/deploy_key docker-compose.prod.yml "$LIGHTSAIL_USER@$LIGHTSAIL_HOST:~/backgammon/"
          scp -i ~/.ssh/deploy_key Caddyfile "$LIGHTSAIL_USER@$LIGHTSAIL_HOST:~/backgammon/"

          ssh -i ~/.ssh/deploy_key "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            "cd ~/backgammon && IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.prod.yml pull && IMAGE_TAG=$IMAGE_TAG docker compose -f docker-compose.prod.yml up -d && docker image prune -af"

      - name: Wait for services to become healthy
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" << 'ENDSSH'
            set -e
            cd ~/backgammon

            check_health() {
              local name=$1
              local max=$2
              for i in $(seq 1 $max); do
                status=$(docker inspect --format='{{.State.Health.Status}}' "$name" 2>/dev/null || echo "missing")
                if [ "$status" = "healthy" ]; then
                  echo "✓ $name healthy"
                  return 0
                fi
                echo "  $name attempt $i/$max: $status"
                sleep 2
              done
              echo "✗ $name failed to become healthy"
              return 1
            }

            check_health backgammon-postgres 30
            check_health backgammon-redis 30
            check_health backgammon-gnubg 60
            check_health backgammon-server 60
            check_health backgammon-webclient 60

            docker exec backgammon-caddy caddy reload --config /etc/caddy/Caddyfile || true

            echo
            echo "Final container status:"
            docker ps --format 'table {{.Names}}\t{{.Status}}'
          ENDSSH
