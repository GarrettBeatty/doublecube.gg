services:
  postgres:
    image: postgres:17-alpine
    container_name: backgammon-postgres-local
    restart: unless-stopped
    environment:
      - POSTGRES_DB=backgammon
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_local_dev
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backgammon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d backgammon"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  server:
    build:
      context: .
      dockerfile: Backgammon.Server/Dockerfile
    container_name: backgammon-server-local
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Postgres=Host=postgres;Database=backgammon;Username=postgres;Password=postgres_local_dev
      - Jwt__Secret=local-test-secret-key-for-development-only-not-secure
      - Jwt__Issuer=BackgammonServer
      - Jwt__Audience=BackgammonClient
      - Jwt__ExpirationDays=7
      - DOMAIN=localhost
    networks:
      - backgammon-net
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  webclient:
    build:
      context: .
      dockerfile: Backgammon.WebClient/Dockerfile
    container_name: backgammon-webclient-local
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Service discovery via Docker network
      - services__backgammon-api__http__0=http://server:5000
    networks:
      - backgammon-net
    depends_on:
      - server
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: backgammon-caddy-local
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=localhost
      - TLS_EMAIL=admin@example.com
    networks:
      - backgammon-net
    depends_on:
      - server
      - webclient
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backgammon-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
